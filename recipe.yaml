RecipeFormatVersion: "2020-01-25"
ComponentName: "com.shishido.PhysicalVerification"
ComponentVersion: "GITHUB_RUN_NUMBER"
ComponentDescription: "Physical GPIO Verification Component"
ComponentPublisher: "Shishido"
ComponentDependencies:
  aws.greengrass.TokenExchangeService:
    VersionRequirement: ">=2.0.0"
    DependencyType: "HARD"
Manifests:
  - Platform:
      os: linux
    Artifacts:
      - URI: "s3://iot-test-pipe/main.py"
      - URI: "s3://iot-test-pipe/entrypoint.py"
      - URI: "s3://iot-test-pipe/hw_test.py"
      # --- 【追加】Phase 1の計測用ファイル ---
      - URI: "s3://iot-test-pipe/dummy_payload.dat"
      - URI: "s3://iot-test-pipe/deploy_timestamp.txt"
    Lifecycle:
      Run:
        Script: "python3 {artifacts:path}/entrypoint.py"
        RequiresPrivilege: true
